# Anycubic Kobra S1 Max + ACE 2 — example dashboard
# =================================================================================
# Layout: ACE 2 on top, the printer in the middle, all the information/controls below.
#
# Requires two HACS "Frontend" cards (install once, then reload resources):
#   - Mushroom        https://github.com/piitaya/lovelace-mushroom
#   - card-mod        https://github.com/thomasloven/lovelace-card-mod
# (Everything else is built into Home Assistant.)
#
# How to use: Settings -> Dashboards -> add dashboard -> open the three-dot menu ->
# "Edit dashboard" -> three-dot menu -> "Raw configuration editor", then paste this as a
# view's cards, OR paste a single card via "Add card -> Manual" using the vertical-stack below.
#
# Entity IDs assume the default device names "Anycubic Kobra S1 Max" and "ACE 2". If you
# renamed either device, do a find/replace on the prefixes "anycubic_kobra_s1_max" / "ace_2".
#
# Printing a file (Kobra S1 / S1 Max only). The "Print a file" tile in the Printer section
# opens the script below, so create the script first: copy it, without the leading "# ",
# into scripts.yaml (or into configuration.yaml under "script:"). The script's fields are
# the fields of the anycubic.print_file action. The printer is optional: with one Anycubic
# printer, leave it empty. To have the form pre-fill it, set a default for the Printer
# field in the script editor.
#
# anycubic_print_a_file:
#   alias: Print a file
#   icon: mdi:file-upload
#   fields:
#     printer:
#       name: Printer
#       required: false
#       selector:
#         device:
#           filter:
#             integration: anycubic
#     file:
#       name: File
#       required: true
#       selector:
#         file:
#           accept: ".gcode,.3mf"
#     allow_clear_bed:
#       name: Cool the bed when done
#       required: true
#       default: false
#       selector:
#         boolean:
#     skip_purge_line:
#       name: Skip the purge line
#       required: true
#       default: false
#       selector:
#         boolean:
#   sequence:
#     - action: anycubic.print_file
#       data: >-
#         {% set data = {'file': file, 'allow_clear_bed': allow_clear_bed | default(false),
#                        'skip_purge_line': skip_purge_line | default(false)} %}
#         {{ dict(data, printer=printer) if printer is defined and printer else data }}
#
# Cool the bed when done (Kobra S1 Max only): the "Cool-down" tile shows how far it has got.


title: Anycubic
views:
  - title: Printer
    path: anycubic
    icon: mdi:printer-3d
    cards:
      - type: vertical-stack
        cards:
          # ============================ Camera (top) ============================
          # Live view auto-shows only while a job is active (the printer lights the
          # chamber for the job anyway). When idle it collapses to a tap-to-view tile,
          # because opening the stream sends startCapture and the printer turns its
          # chamber light on with capture — so idle page views never wake the light.
          # The idle still is one kept frame: the integration takes a new one only when
          # the job state changes, switching the light back off if it was off.
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.anycubic_kobra_s1_max_printing
                    state: "on"
                  - condition: state
                    entity: binary_sensor.anycubic_kobra_s1_max_paused
                    state: "on"
                  - condition: state
                    entity: sensor.anycubic_kobra_s1_max_status
                    state: [preheating, printing, pausing, paused, resuming, resumed]
            card:
              type: picture-glance
              title: ""
              camera_image: camera.anycubic_kobra_s1_max_camera
              camera_view: live
              entities:
                - entity: light.anycubic_kobra_s1_max_chamber_light
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.anycubic_kobra_s1_max_printing
                state_not: "on"
              - condition: state
                entity: binary_sensor.anycubic_kobra_s1_max_paused
                state_not: "on"
              - condition: state
                entity: sensor.anycubic_kobra_s1_max_status
                state_not: [preheating, printing, pausing, paused, resuming, resumed]
            card:
              type: vertical-stack
              cards:
                - type: picture-entity
                  entity: camera.anycubic_kobra_s1_max_camera
                  camera_view: auto
                  show_name: false
                  show_state: false
                  tap_action:
                    action: more-info
                - type: custom:mushroom-template-card
                  entity: camera.anycubic_kobra_s1_max_camera
                  primary: Camera
                  secondary: Tap to view the live feed
                  icon: mdi:cctv
                  icon_color: disabled
                  tap_action:
                    action: more-info

          # ============================ ACE 2 ============================
          - type: custom:mushroom-title-card
            title: ACE 2
            subtitle: Filament

          # Four filament slots — the icon is tinted with each slot's real filament colour,
          # a green check badge marks the loaded slot.
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.ace_2_slot_1
                primary: Slot 1
                secondary: >-
                  {{ states('sensor.ace_2_slot_1') }}{% if state_attr('sensor.ace_2_slot_1','remaining') is not none %} · {{ state_attr('sensor.ace_2_slot_1','remaining') }}%{% endif %}
                icon: mdi:printer-3d-nozzle
                badge_icon: >-
                  {{ 'mdi:check-circle' if state_attr('sensor.ace_2_slot_1','loaded') else '' }}
                badge_color: green
                card_mod:
                  style: |
                    ha-card ha-state-icon {
                      color: {{ state_attr('sensor.ace_2_slot_1','color') or '#888888' }} !important;
                    }
              - type: custom:mushroom-template-card
                entity: sensor.ace_2_slot_2
                primary: Slot 2
                secondary: >-
                  {{ states('sensor.ace_2_slot_2') }}{% if state_attr('sensor.ace_2_slot_2','remaining') is not none %} · {{ state_attr('sensor.ace_2_slot_2','remaining') }}%{% endif %}
                icon: mdi:printer-3d-nozzle
                badge_icon: >-
                  {{ 'mdi:check-circle' if state_attr('sensor.ace_2_slot_2','loaded') else '' }}
                badge_color: green
                card_mod:
                  style: |
                    ha-card ha-state-icon {
                      color: {{ state_attr('sensor.ace_2_slot_2','color') or '#888888' }} !important;
                    }
              - type: custom:mushroom-template-card
                entity: sensor.ace_2_slot_3
                primary: Slot 3
                secondary: >-
                  {{ states('sensor.ace_2_slot_3') }}{% if state_attr('sensor.ace_2_slot_3','remaining') is not none %} · {{ state_attr('sensor.ace_2_slot_3','remaining') }}%{% endif %}
                icon: mdi:printer-3d-nozzle
                badge_icon: >-
                  {{ 'mdi:check-circle' if state_attr('sensor.ace_2_slot_3','loaded') else '' }}
                badge_color: green
                card_mod:
                  style: |
                    ha-card ha-state-icon {
                      color: {{ state_attr('sensor.ace_2_slot_3','color') or '#888888' }} !important;
                    }
              - type: custom:mushroom-template-card
                entity: sensor.ace_2_slot_4
                primary: Slot 4
                secondary: >-
                  {{ states('sensor.ace_2_slot_4') }}{% if state_attr('sensor.ace_2_slot_4','remaining') is not none %} · {{ state_attr('sensor.ace_2_slot_4','remaining') }}%{% endif %}
                icon: mdi:printer-3d-nozzle
                badge_icon: >-
                  {{ 'mdi:check-circle' if state_attr('sensor.ace_2_slot_4','loaded') else '' }}
                badge_color: green
                card_mod:
                  style: |
                    ha-card ha-state-icon {
                      color: {{ state_attr('sensor.ace_2_slot_4','color') or '#888888' }} !important;
                    }

          # ACE environment + dryer
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.ace_2_humidity
                icon: mdi:water-percent
                name: Humidity
              - type: custom:mushroom-entity-card
                entity: sensor.ace_2_box_temperature
                icon: mdi:thermometer
                name: Box temp
              - type: custom:mushroom-entity-card
                entity: sensor.ace_2_loaded_slot
                icon: mdi:tray-arrow-down
                name: Loaded
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.ace_2_drying
                icon: mdi:weather-sunny
              - type: custom:mushroom-entity-card
                entity: switch.ace_2_auto_feed
                icon: mdi:autorenew
          - type: entities
            title: Drying setpoints
            entities:
              - entity: number.ace_2_drying_temperature
              - entity: number.ace_2_drying_time
              - entity: sensor.ace_2_drying_time_remaining

          # ============================ Printer ============================
          - type: custom:mushroom-title-card
            title: Kobra S1 Max

          # Idle shows just "Idle" — the percent (and the gauge below) belong to a job.
          # When no print is running the integration reports the LAST print's numbers
          # (progress 100, final layer), so job cards are gated on an active job.
          - type: custom:mushroom-template-card
            entity: sensor.anycubic_kobra_s1_max_status
            primary: >-
              {% if is_state('binary_sensor.anycubic_kobra_s1_max_printing','on')
                 or is_state('binary_sensor.anycubic_kobra_s1_max_paused','on') %}
              {{ states('sensor.anycubic_kobra_s1_max_status') | capitalize }} · {{ states('sensor.anycubic_kobra_s1_max_progress') }}%
              {% else %}
              {{ states('sensor.anycubic_kobra_s1_max_status') | capitalize }}
              {% endif %}
            icon: mdi:printer-3d
            icon_color: >-
              {{ 'blue' if is_state('binary_sensor.anycubic_kobra_s1_max_printing','on')
                 else ('orange' if is_state('binary_sensor.anycubic_kobra_s1_max_paused','on') else 'disabled') }}

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.anycubic_kobra_s1_max_printing
                    state: "on"
                  - condition: state
                    entity: binary_sensor.anycubic_kobra_s1_max_paused
                    state: "on"
                  - condition: state
                    entity: sensor.anycubic_kobra_s1_max_status
                    state: [preheating, printing, pausing, paused, resuming, resumed]
            card:
              type: gauge
              entity: sensor.anycubic_kobra_s1_max_progress
              name: Progress
              min: 0
              max: 100
              needle: true
              severity:
                green: 0
                yellow: 0
                red: 0

          # Print controls. Button entities have no useful state to display (their state
          # is the last-pressed timestamp, "Unknown" until first press), so the chips are
          # icon-only and tap performs the press. Unavailable buttons (e.g. Resume while
          # not paused) render dimmed automatically.
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: button.anycubic_kobra_s1_max_pause
                content_info: none
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_pause
              - type: entity
                entity: button.anycubic_kobra_s1_max_resume
                content_info: none
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_resume
              - type: entity
                entity: button.anycubic_kobra_s1_max_stop
                content_info: none
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_stop
                  confirmation:
                    text: Stop this print?

          # Printing from Home Assistant (Kobra S1 / S1 Max). "Print a file" opens the script
          # from the top of this file. The Bed tile follows the "Bed needs clearing" sensor.
          # Press "Bed is clear" only after taking the part off the bed, and never automate it.
          # Both the tile and its icon ask for confirmation before a button is pressed.
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: script.anycubic_print_a_file
                primary: Print a file
                icon: mdi:file-upload
                color: blue
                tap_action:
                  action: more-info
                icon_tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: button.anycubic_kobra_s1_max_print_again
                primary: Print again
                icon: mdi:repeat
                color: blue
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_print_again
                  confirmation:
                    text: Print the last file again?
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_print_again
                  confirmation:
                    text: Print the last file again?
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: binary_sensor.anycubic_kobra_s1_max_bed_needs_clearing
                primary: Bed
                secondary: >-
                  {{ 'Needs clearing' if is_state(entity, 'on')
                     else 'Clear' if is_state(entity, 'off') else 'Unknown' }}
                icon: >-
                  {{ 'mdi:printer-3d-nozzle-alert' if is_state(entity, 'on')
                     else 'mdi:printer-3d-nozzle' }}
                color: >-
                  {{ 'orange' if is_state(entity, 'on')
                     else 'green' if is_state(entity, 'off') else 'disabled' }}
                tap_action:
                  action: more-info
                icon_tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: button.anycubic_kobra_s1_max_bed_is_clear
                primary: Bed is clear
                icon: mdi:check-bold
                color: blue
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_bed_is_clear
                  confirmation:
                    text: Is the bed empty?
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anycubic_kobra_s1_max_bed_is_clear
                  confirmation:
                    text: Is the bed empty?
          # Cool the bed when done (Kobra S1 Max). Delete this tile on other printers.
          - type: custom:mushroom-template-card
            entity: sensor.anycubic_kobra_s1_max_bed_cool_down
            primary: Cool-down
            secondary: >-
              {{ {'off': 'Off', 'armed': 'Print running', 'ready': 'Cooling', 'done': 'Cool',
                  'failed': 'Failed', 'expired': 'Not cooled in time',
                  'stopped': 'Stopped'}.get(states(entity), 'Unknown') }}
            icon: mdi:snowflake-thermometer
            color: >-
              {{ 'green' if is_state(entity, 'done')
                 else 'blue' if is_state(entity, 'ready')
                 else 'orange' if states(entity) in ('failed', 'expired') else 'disabled' }}
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info

          # ============================ Information (below) ============================
          - type: glance
            title: Temperatures
            columns: 3
            entities:
              - entity: sensor.anycubic_kobra_s1_max_nozzle_temperature
                name: Nozzle
              - entity: sensor.anycubic_kobra_s1_max_bed_temperature
                name: Bed
              - entity: sensor.anycubic_kobra_s1_max_chamber_temperature
                name: Chamber

          # Job details are stale between jobs (last print's values) — active jobs only.
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.anycubic_kobra_s1_max_printing
                    state: "on"
                  - condition: state
                    entity: binary_sensor.anycubic_kobra_s1_max_paused
                    state: "on"
                  - condition: state
                    entity: sensor.anycubic_kobra_s1_max_status
                    state: [preheating, printing, pausing, paused, resuming, resumed]
            card:
              type: entities
              title: Print
              entities:
                - entity: sensor.anycubic_kobra_s1_max_status
                - entity: sensor.anycubic_kobra_s1_max_progress
                - entity: sensor.anycubic_kobra_s1_max_current_layer
                - entity: sensor.anycubic_kobra_s1_max_total_layers
                - entity: sensor.anycubic_kobra_s1_max_time_remaining
                - entity: sensor.anycubic_kobra_s1_max_elapsed_time
                - entity: sensor.anycubic_kobra_s1_max_filament_used
                - type: conditional
                  conditions:
                    - entity: binary_sensor.anycubic_kobra_s1_max_paused
                      state: "on"
                  row:
                    entity: sensor.anycubic_kobra_s1_max_pause_reason
                - entity: sensor.anycubic_kobra_s1_max_file_name
                - entity: event.anycubic_kobra_s1_max_print_event
                  name: Last event

          - type: entities
            title: Controls
            entities:
              - entity: select.anycubic_kobra_s1_max_print_speed
              - entity: number.anycubic_kobra_s1_max_nozzle_target_temperature
              - entity: number.anycubic_kobra_s1_max_bed_target_temperature
              - entity: number.anycubic_kobra_s1_max_part_cooling_fan
              - entity: number.anycubic_kobra_s1_max_auxiliary_fan
              - entity: number.anycubic_kobra_s1_max_chamber_fan
              - entity: light.anycubic_kobra_s1_max_chamber_light

          - type: entities
            title: Machine
            entities:
              - entity: sensor.anycubic_kobra_s1_max_firmware
