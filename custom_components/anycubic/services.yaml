print_file:
  fields:
    printer:
      required: false
      selector:
        device:
          filter:
            integration: anycubic
    file:
      required: true
      selector:
        file:
          accept: ".gcode,.3mf"
    allow_clear_bed:
      required: false
      default: false
      selector:
        boolean:

print_again:
  fields:
    printer:
      required: false
      selector:
        device:
          filter:
            integration: anycubic
    allow_clear_bed:
      required: false
      default: false
      selector:
        boolean:

clear_bed:
  fields:
    printer:
      required: false
      selector:
        device:
          filter:
            integration: anycubic
    door_open_confirmed:
      required: false
      default: false
      selector:
        boolean:
